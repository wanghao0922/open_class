services:
  - type: web
    name: sunscreen-classroom
    runtime: python
    plan: free
    rootDir: sunscreen_classroom
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: 22.16.0
      - key: TEACHER_USERNAME
        value: gxl
      - key: TEACHER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sunscreen-classroom-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: sunscreen-classroom-db
    plan: free
    databaseName: sunscreen_classroom
    user: sunscreen_classroom
