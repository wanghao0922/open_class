services:
  - type: web
    name: sunscreen-classroom
    runtime: python
    plan: free
    rootDir: sunscreen_classroom
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: uvicorn backend.gateway:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: 22.16.0
      - key: LOCAL_RELAY_TOKEN
        sync: false
